name: Go test&lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  parse-go-work:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extract.outputs.matrix }}
      lint_matrix: ${{ steps.extract.outputs.lint_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: extract
        run: |
          {
            echo -n "matrix="
            find . -name "go.mod" -exec dirname {} \; | grep -v "/test/ginkgo" | jq -c -R -s 'split("\n") | map(select(length > 0))'
            echo -n "lint_matrix="
            find . -name "go.mod" -exec dirname {} \; | jq -c -R -s 'split("\n") | map(select(length > 0))'
          } >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: [parse-go-work]
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.parse-go-work.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: ${{ matrix.directory }}
      - name: Run test
        run: |
          go test ./... --shuffle on --parallel 10 --p 10
        working-directory: ${{ matrix.directory }}

  lint:
    runs-on: ubuntu-latest
    needs: [parse-go-work]
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.parse-go-work.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: ${{ matrix.directory }}
      - name: Install aqua tools
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
      - name: golangci-lint
        run: golangci-lint run
        working-directory: ${{ matrix.directory }}

  test-ginkgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/ginkgo/go.mod
          cache-dependency-path: test/ginkgo
      - name: Run ginkgo test
        run: |
          go tool ginkgo -p
        working-directory: test/ginkgo
